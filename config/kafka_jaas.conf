// kafka_jaas.conf — JAAS config for the Kafka broker.
//
// Mounted into the container at /etc/kafka/kafka_jaas.conf and referenced by
// KAFKA_OPTS=-Djava.security.auth.login.config=...
//
// KafkaServer: inter-broker SCRAM authentication (single-broker setup: this
// authenticates the broker when it connects to itself on the INTERNAL listener).
//
// NOTE: We do NOT include a "Client" section here. Including it would cause the
// broker to attempt SASL authentication with ZooKeeper, which runs without auth.
// ZooKeeper SASL is disabled via -Dzookeeper.sasl.client=false in KAFKA_OPTS.

KafkaServer {
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="kafka-broker"
    password="kafka-broker-secret";
};
